<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Список задач</title>
    <style>
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid black; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h1>Список всех задач (To-Do List)</h1>
    
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Название</th>
                <th>Статус</th>
                <th>Дедлайн</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="task : ${task}">
                <td th:text="${task.id}">1</td>
                <td th:text="${task.title}">Купить хлеб</td>
                <td th:text="${task.status}">NEW</td>
                <td th:text="${task.deadline}">2026-10-10</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
